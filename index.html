<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:title" content="おっさん、人生ひと段落したので異世界で魔王を始めます ─ 世界図鑑">
<meta property="og:description" content="人物・魔物・用語の図鑑、世界地図、全話あらすじ。各話からカクヨム本文へ飛べます。">

<title>魔王図鑑 ─ おっさん、人生ひと段落したので異世界で魔王を始めます</title>
<style>
:root{
  --paper:#fbfaf7;
  --paper-2:#f4f1ea;
  --card:#ffffff;
  --ink:#15202c;
  --ink-2:#3d4a58;
  --muted:#71808f;
  --faint:#9aa6b2;
  --gold:#9a7b32;
  --gold-lt:#c3a76a;
  --hair:#e3ddd0;
  --hair-2:#d3cab6;
  --shadow-s:0 1px 2px rgba(35,28,14,.05);
  --shadow-m:0 2px 4px rgba(35,28,14,.05), 0 10px 26px rgba(35,28,14,.07);
  --shadow-l:0 8px 20px rgba(35,28,14,.10), 0 32px 70px rgba(35,28,14,.14);
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP","MS PMincho",serif;
  --sans:"Yu Gothic UI","Yu Gothic","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;
  --acc:var(--gold);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;line-height:1.8;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:rgba(154,123,50,.18)}

/* ══════════ ヘッダー ══════════ */
.hero{
  padding:clamp(48px,7vw,86px) 24px clamp(34px,4vw,46px);
  text-align:center;position:relative;
  background:
    linear-gradient(180deg,#ffffff 0%, var(--paper) 100%);
  border-bottom:1px solid var(--hair);
}
.hero::after{
  content:"";position:absolute;left:0;right:0;bottom:3px;height:1px;background:var(--hair);
}
.crest{width:44px;height:44px;margin:0 auto 22px;display:block}
.hero h1{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(28px,5vw,46px);
  letter-spacing:.24em;text-indent:.24em;color:var(--ink);
}
.hero .rule{
  width:min(300px,64%);height:1px;margin:22px auto 16px;position:relative;
  background:linear-gradient(90deg,transparent,var(--hair-2) 20%,var(--hair-2) 80%,transparent);
}
.hero .rule::after{
  content:"◆";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:7px;color:var(--gold);background:var(--paper);padding:0 10px;
}
.hero .sub{
  font-family:var(--serif);font-size:clamp(11px,1.5vw,13px);
  letter-spacing:.3em;text-indent:.3em;color:var(--gold);
}
.hero .lead{
  margin:20px auto 0;max-width:560px;font-size:13px;color:var(--muted);
  line-height:2.1;letter-spacing:.05em;
}

/* ══════════ ナビ ══════════ */
.navbar{
  position:sticky;top:0;z-index:30;
  background:rgba(251,250,247,.9);
  backdrop-filter:blur(14px) saturate(160%);
  border-bottom:1px solid var(--hair);
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset;
}
.navbar-in{
  max-width:1240px;margin:0 auto;padding:11px 24px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:space-between;
}
.tabs{display:flex;gap:2px}
.tab{
  position:relative;cursor:pointer;background:none;border:0;
  font-family:var(--serif);font-size:14px;letter-spacing:.18em;text-indent:.18em;
  padding:9px 18px 11px;color:var(--faint);transition:color .2s var(--ease);
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink)}
.tab::after{
  content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;
  background:var(--gold);transform:scaleX(0);transform-origin:center;
  transition:transform .3s var(--ease);
}
.tab.active::after{transform:scaleX(1)}
.tab .n{font-family:var(--sans);font-size:10px;letter-spacing:0;color:var(--gold);
  margin-left:5px;vertical-align:2px;opacity:.75}

.search{position:relative;flex-shrink:0}
.search input{
  width:min(260px,52vw);padding:9px 14px 9px 36px;
  background:#fff;border:1px solid var(--hair-2);border-radius:2px;
  color:var(--ink);font-family:var(--sans);font-size:13.5px;
  outline:none;transition:.22s var(--ease);box-shadow:var(--shadow-s);
}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(154,123,50,.1)}
.search input::placeholder{color:#a9b3bd}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6;line-height:0}

/* ══════════ タグ ══════════ */
.tagbar{
  max-width:1240px;margin:0 auto;padding:22px 24px 0;
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;
}
.tagbar .lbl{
  font-family:var(--serif);font-size:11px;letter-spacing:.2em;color:var(--gold);margin-right:6px;
}
.chip{
  cursor:pointer;background:#fff;
  font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;
  padding:4px 13px;border:1px solid var(--hair-2);border-radius:999px;
  color:var(--muted);transition:.18s var(--ease);
}
.chip:hover{color:var(--ink);border-color:var(--gold);box-shadow:var(--shadow-s)}
.chip.on{background:var(--gold);color:#fff;border-color:var(--gold);box-shadow:var(--shadow-s)}

.meta{
  max-width:1240px;margin:0 auto;padding:24px 24px 12px;
  display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--hair);
}
.meta .ttl{font-family:var(--serif);font-size:15px;letter-spacing:.22em;color:var(--ink)}
.meta .cnt{font-size:11px;letter-spacing:.14em;color:var(--faint)}

/* ══════════ グリッド ══════════ */
.grid{
  max-width:1240px;margin:0 auto;padding:28px 24px 96px;
  display:grid;gap:22px;
  grid-template-columns:repeat(auto-fill,minmax(214px,1fr));
}
.card{
  --acc:var(--gold);
  position:relative;cursor:pointer;text-align:left;
  background:var(--card);
  border:1px solid var(--hair-2);
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-s);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease);
}
.card[data-cat="monster"]{--acc:#a3562f}
.card[data-cat="term"]{--acc:#3c648f}
/* 二重罫の内枠 */
.card .inner-rule{
  position:absolute;inset:5px;border:1px solid var(--hair);pointer-events:none;
  opacity:0;transition:opacity .3s var(--ease);z-index:2;
}
.card:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow-m);
  border-color:color-mix(in srgb,var(--acc) 55%,var(--hair-2));
}
.card:hover .inner-rule{opacity:1}
.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* 上辺のアクセント */
.card::before{
  content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;
  background:var(--acc);transform:scaleX(0);transform-origin:center;
  transition:transform .34s var(--ease);z-index:3;
}
.card:hover::before{transform:scaleX(1)}

.thumb{
  aspect-ratio:4/5;width:100%;position:relative;overflow:hidden;
  background:
    repeating-linear-gradient(45deg,rgba(154,123,50,.035) 0 1px,transparent 1px 9px),
    linear-gradient(170deg,#faf7f0 0%,#f1ece1 100%);
  display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--hair);
}
.thumb img{
  width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;
  transition:transform .55s var(--ease);
}
.card:hover .thumb img{transform:scale(1.05)}

/* 画像未設定：菱形モノグラム */
.mono{display:flex;flex-direction:column;align-items:center;gap:14px}
.mono .ring{
  width:70px;height:70px;display:grid;place-items:center;position:relative;
  border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);
  transform:rotate(45deg);background:rgba(255,255,255,.6);
}
.mono .ring::after{
  content:"";position:absolute;inset:4px;
  border:1px solid color-mix(in srgb,var(--acc) 20%,transparent);
}
.mono .ring span{
  transform:rotate(-45deg);font-family:var(--serif);font-size:27px;
  color:color-mix(in srgb,var(--acc) 85%,transparent);
}
.mono .cap{
  font-family:var(--serif);font-size:10px;letter-spacing:.24em;text-indent:.24em;
  color:var(--faint);
}

.card-body{padding:15px 16px 17px;display:flex;flex-direction:column;flex:1}
.card-name{font-family:var(--serif);font-size:18px;letter-spacing:.07em;color:var(--ink);line-height:1.4}
.card-kana{font-size:10.5px;letter-spacing:.16em;color:var(--faint);margin-top:3px}
.card-tl{font-size:12px;color:var(--muted);line-height:1.7;margin-top:9px;flex:1}
.card-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.mini{
  font-size:9.5px;letter-spacing:.08em;padding:2px 9px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--acc) 32%,transparent);
  color:color-mix(in srgb,var(--acc) 88%,transparent);
  background:color-mix(in srgb,var(--acc) 5%,transparent);
}
/* 用語カードは画像を持たないので、飾り帯だけの薄いヘッダにする */
.card[data-cat="term"] .thumb{aspect-ratio:5/2}
.card[data-cat="term"] .mono{gap:0}
.card[data-cat="term"] .mono .ring{width:46px;height:46px}
.card[data-cat="term"] .mono .ring span{font-size:19px}
.card[data-cat="term"] .mono .cap{display:none}
.detail[data-cat="term"] .d-body{grid-template-columns:1fr}
.detail[data-cat="term"] .d-img{display:none}

.empty{
  grid-column:1/-1;text-align:center;padding:96px 20px;
  font-family:var(--serif);letter-spacing:.2em;color:var(--faint);
}

/* ══════════ 詳細 ══════════ */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(30,26,18,.42);backdrop-filter:blur(5px);
  overflow-y:auto;padding:clamp(16px,4vw,52px) clamp(12px,3vw,24px);
}
.overlay.open{display:block}
.detail{
  --acc:var(--gold);
  width:100%;max-width:980px;margin:0 auto;position:relative;
  background:var(--card);border:1px solid var(--hair-2);
  box-shadow:var(--shadow-l);animation:rise .3s var(--ease);
}
.detail[data-cat="monster"]{--acc:#a3562f}
.detail[data-cat="term"]{--acc:#3c648f}
.detail::before{
  content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:4px;background:var(--acc);
}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.d-head{padding:34px 36px 24px;border-bottom:1px solid var(--hair);text-align:center;position:relative}
.d-head .cat{
  font-family:var(--serif);font-size:10px;letter-spacing:.32em;text-indent:.32em;
  color:var(--acc);margin-bottom:13px;
}
.d-head h2{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(23px,3.4vw,33px);letter-spacing:.13em;text-indent:.13em;color:var(--ink);
}
.d-head .kana{font-size:11px;letter-spacing:.26em;color:var(--faint);margin-top:8px;font-family:var(--serif)}
.d-head .tl{
  margin:17px auto 0;max-width:620px;font-family:var(--serif);
  font-size:13.5px;color:var(--muted);letter-spacing:.08em;
}
.d-nav{position:absolute;top:16px;right:16px;display:flex;gap:6px}
.d-nav button{
  width:34px;height:34px;background:#fff;cursor:pointer;
  border:1px solid var(--hair-2);color:var(--gold);
  font-size:15px;line-height:1;border-radius:2px;
  transition:.18s var(--ease);box-shadow:var(--shadow-s);
}
.d-nav button:hover:not([disabled]){background:var(--gold);color:#fff;border-color:var(--gold)}
.d-nav button[disabled]{opacity:.3;cursor:default}

.d-body{display:grid;grid-template-columns:318px 1fr}
@media(max-width:780px){.d-body{grid-template-columns:1fr}}
.d-img{
  border-right:1px solid var(--hair);padding:24px;
  background:
    repeating-linear-gradient(45deg,rgba(154,123,50,.03) 0 1px,transparent 1px 9px),
    linear-gradient(170deg,#faf7f0,#f1ece1);
  display:flex;align-items:flex-start;justify-content:center;
}
@media(max-width:780px){.d-img{border-right:none;border-bottom:1px solid var(--hair)}}
.d-img img{width:100%;display:block;border:1px solid var(--hair-2);box-shadow:var(--shadow-s)}
.d-img .mono{padding:60px 0}
.d-img-wrap{width:100%}
/* 姿の切り替え */
.vars{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.var{
  cursor:pointer;background:#fff;border:1px solid var(--hair-2);border-radius:2px;
  padding:0;overflow:hidden;width:62px;transition:.18s var(--ease);box-shadow:var(--shadow-s);
}
.var img{width:100%;height:74px;object-fit:cover;object-position:center 15%;display:block;border:0;box-shadow:none}
.var .vlab{
  font-family:var(--serif);font-size:9px;letter-spacing:.04em;color:var(--muted);
  padding:3px 2px;text-align:center;line-height:1.3;border-top:1px solid var(--hair);
}
.var:hover{border-color:var(--acc)}
.var.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 28%,transparent)}
.var.on .vlab{color:var(--acc)}

.d-info{padding:28px 32px 36px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:10px 4px;border-bottom:1px solid var(--hair)}
th{
  width:94px;white-space:nowrap;font-weight:400;
  font-family:var(--serif);font-size:12.5px;letter-spacing:.12em;color:var(--gold);
}
td{color:var(--ink-2);line-height:1.85}

.sect{margin-top:28px}
.sect h3{
  font-family:var(--serif);font-weight:500;font-size:12px;
  letter-spacing:.28em;text-indent:.28em;color:var(--acc);
  margin-bottom:12px;display:flex;align-items:center;gap:12px;
}
.sect h3::after{content:"";flex:1;height:1px;background:var(--hair)}
.sect p{font-size:13.5px;line-height:2.1;color:var(--ink-2)}
.quote{
  font-family:var(--serif);font-size:17px;line-height:2;color:var(--ink);
  padding:18px 22px;border-left:3px solid var(--acc);
  background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 6%,transparent),transparent);
}
.note{
  font-size:12.5px;line-height:2;color:var(--muted);
  padding:15px 18px;background:var(--paper-2);border:1px solid var(--hair);
}

footer{
  text-align:center;padding:36px 20px 56px;font-family:var(--serif);
  font-size:10.5px;letter-spacing:.28em;text-indent:.28em;color:var(--faint);
  border-top:1px solid var(--hair);background:#fff;
}
</style>
</head>
<body>
<div class="wrap">

  <section class="hero">
    <svg class="crest" viewBox="0 0 60 60" fill="none" stroke="#9a7b32" stroke-width="1.1">
      <circle cx="30" cy="30" r="26" opacity=".4"/>
      <path d="M30 12v36M18 22c8 4 16 4 24 0M18 38c8-4 16-4 24 0" opacity=".85"/>
      <circle cx="30" cy="30" r="5" opacity=".95"/>
    </svg>
    <h1>魔王図鑑</h1>
    <div class="rule"></div>
    <div class="sub">おっさん、人生ひと段落したので異世界で魔王を始めます</div>
    <p class="lead">人も、魔族も、魔物も。この世界に生きるものたちの記録。</p>
  </section>

  <nav class="navbar">
    <div class="navbar-in">
      <div class="tabs" id="tabs"></div>
      <a href="episodes.html" class="tab" style="text-decoration:none">各話まとめ</a>
      <a href="map.html" class="tab" style="text-decoration:none">世 界 地 図</a>
      <div class="search">
        <span class="ico">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9a7b32" stroke-width="2.2">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/>
          </svg>
        </span>
        <input type="text" id="q" placeholder="名前・設定を検索…" autocomplete="off">
      </div>
    </div>
  </nav>

  <div class="tagbar" id="tagbar"></div>
  <div class="meta"><span class="ttl" id="metaTtl"></span><span class="cnt" id="metaCnt"></span></div>
  <div class="grid" id="grid"></div>

  <footer>MAOU ZUKAN &nbsp;&nbsp;／&nbsp;&nbsp; 設定は本文を正とする</footer>
</div>

<div class="overlay" id="overlay"><div class="detail" id="detail"></div></div>

<script>
/* === DATA:BEGIN === */
/* =========================================================
   おっさん、人生ひと段落したので異世界で魔王を始めます
   世界図鑑 ─ データファイル
   ---------------------------------------------------------
   img: "char/アクロス_確定" のように書くと
        一覧 → ../設定イラスト/thumbs/char/アクロス_確定.jpg
        詳細 → ../設定イラスト/キャラ確定イラスト/アクロス_確定.png
        （monster の場合は 魔物確定イラスト/）
   ※ 設定は本文を正とする。DBの記述は採用しない。

   並び順：人物・魔物とも本文での登場が早い順。
           アクロス／佐伯航／リーネ／クロ／フレスだけ先頭に固定。
           ガドラとヴォスはドルクの隣、ヴァイスは本人が出る英雄譚第四章の位置。
           各項目の上のコメントが、その初登場話。
           並べ直すときは node _order.js && node _reorder.js
           固定と例外は _reorder.js の PINNED / OVERRIDE に書いてある。
   ========================================================= */

const ZUKAN_DATA = [

/* ═════════════ 人 物 ─ 登場順 ═════════════ */
/* 先頭固定 */
{ id:"acros", category:"character", name:"アクロス", kana:"Acros",
  tagline:"人生ひと段落したので、異世界で魔王を始めます",
  tags:["主要","魔族","★4"], img:"char/アクロス_確定",
  fields:[
    {label:"前世", value:"佐伯 航（さえき わたる）"},
    {label:"種族",   value:"魔族（転生者）"},
    {label:"外見年齢",value:"人間として見るなら三十そこそこ。渋さと若さが同居する凄みのある顔"},
    {label:"肌",     value:"仄かに青みがかった、冷たい金属を思わせる色調"},
    {label:"瞳",     value:"オッドアイ。右が深い琥珀色、左が鮮烈な紅"},
    {label:"角",     value:"額の中央から一本。黒紫。真っ直ぐ伸びてわずかに後方へ反る"},
    {label:"髪",     value:"黒。根元に赤紫の光沢。肩にかかる長さ"},
    {label:"魔紋",   value:"指先から手の甲にかけて、薄い黒紫の紋様が血管のように浮かぶ"},
    {label:"服装",   value:"黒地に暗紫の裏地のロングコート／炭色の詰襟／黒革ベルト二本交差／軍用風カーゴパンツ／黒革ロングブーツ"},
    {label:"スキル", value:"原初の奔流★4・魔の創造★3・無限器★4"},
    {label:"武器",   value:"アクロスソード（黒紫の直剣・魔力固体化）／ショートソード（グロム製）"},
    {label:"住まい", value:"グラザ東通り・トマス邸隣"}],
  overview:"トラックに轢かれて死亡し、女神ファルティシアと出会って転生した元・日本のサラリーマン。人間と魔族が共に生きられる場所を作るため、魔王を目指す。飄々として力が抜けているが、目の奥だけは据わっている。積み上げてきた人生の経験が、そのまま武器になる。",
  quote:"心構えを崩さず行動を続けることで、いつか信念と呼べる日がくる",
  note:"【殺す覚悟・5箇条】①殺さないことを原則にしない ②殺すことを目的にしない ③一つ一つの死を忘れない ④決めるのは自分 ⑤殺すなら殺される" },

  fields:[
    {label:"段階", value:"下から 銅・鉄・銀・金・白金 の五段階"},
    {label:"開始", value:"初めての者は全員、仮登録の木札からのスタート"},
    {label:"木札の制限", value:"単独では★1相当の依頼しか受けられない"},
    {label:"例外", value:"実力が認められれば、上位の依頼にも参加できる"}],
  overview:"★ランクが個人の実力を示すのに対し、ギルドランクは冒険者としての実績と信用の段階。魔狼討伐のような依頼も、実力が認められれば仮登録のまま受けられた。",
  quote:null, note:"★ランクとギルドランクは別の指標" }

];

window.ZUKAN_DATA = ZUKAN_DATA;
/* === DATA:END === */
</script>
<script>
/* 「すべて」は置かない。最初に開いた人が見るのは人物図鑑 */
const CATS = [
  { id:"character", label:"人 物" },
  { id:"monster",   label:"魔 物" },
  { id:"term",      label:"用 語" }
];
const CAT_LABEL = { character:"人物", monster:"魔物", term:"用語" };

let curCat = "character", curTag = null, curQ = "", viewList = [];

const $  = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function renderTabs(){
  $("#tabs").innerHTML = CATS
    .filter(c => ZUKAN_DATA.some(d => d.category === c.id))
    .map(c => {
      const n = ZUKAN_DATA.filter(d => d.category === c.id).length;
      return `<button class="tab${c.id===curCat?" active":""}" data-cat="${c.id}">${c.label}<span class="n">${n}</span></button>`;
    }).join("");
  document.querySelectorAll(".tab").forEach(b =>
    b.onclick = () => { curCat = b.dataset.cat; curTag = null; render(); });
}

function renderTags(){
  const pool = ZUKAN_DATA.filter(d => d.category === curCat);
  const tags = [...new Set(pool.flatMap(d => d.tags || []))];
  $("#tagbar").innerHTML =
    `<span class="lbl">絞り込み</span>` +
    tags.map(t => `<button class="chip${curTag===t?" on":""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b =>
    b.onclick = () => { curTag = (curTag === b.dataset.tag) ? null : b.dataset.tag; render(); });
}

function filtered(){
  const q = curQ.trim().toLowerCase();
  return ZUKAN_DATA.filter(d => {
    /* 検索中は分類をまたいで探す。
       「すべて」タブを外したので、これが無いと
       人物タブのまま魔物名を打っても何も出ない。 */
    if (!q && d.category !== curCat) return false;
    if (curTag && !(d.tags || []).includes(curTag)) return false;
    if (!q) return true;
    return [d.name,d.kana,d.tagline,d.overview,d.quote,d.note,
            ...(d.tags||[]),
            ...(d.fields||[]).flatMap(f => [f.label,f.value])]
           .join(" ").toLowerCase().includes(q);
  });
}

function monoHTML(d, cap){
  return `<div class="mono"><div class="ring"><span>${esc((d.name||"?").slice(0,1))}</span></div>`
       + `<div class="cap">${esc(cap)}</div></div>`;
}
/* img:"char/アクロス_確定" → 一覧はサムネ(jpg)、詳細は原寸(png) */
function imgPaths(d){
  if (!d.img) return null;
  const i = d.img.indexOf("/");
  const dir = d.img.slice(0, i), file = d.img.slice(i + 1);
  return {
    thumb: "img/thumb/" + dir + "/" + encodeURIComponent(file) + ".jpg",
    full:  "img/full/"  + dir + "/" + encodeURIComponent(file) + ".jpg"
  };
}
function visual(d, big){
  const p = imgPaths(d);
  if (p) {
    const src = big ? p.full : p.thumb;
    return `<img src="${src}" alt="${esc(d.name)}" loading="lazy">`;
  }
  return monoHTML(d, "イラスト未設定");
}
/* 姿の切り替え（人間形態・衣装違い・前世など）。2枚以上ある時だけ出す */
function variantsHTML(d){
  if (!d.variants || d.variants.length < 2) return "";
  return `<div class="vars">` + d.variants.map((v, i) => {
    const p = imgPaths({ img: v.img });
    return `<button class="var${i === 0 ? " on" : ""}" data-full="${p.full}" title="${esc(v.label)}">`
         + `<img src="${p.thumb}" alt="${esc(v.label)}">`
         + `<div class="vlab">${esc(v.label)}</div></button>`;
  }).join("") + `</div>`;
}
function bindVariants(root){
  const main = root.querySelector(".d-img-wrap > img");
  if (!main) return;
  root.querySelectorAll(".var").forEach(b => {
    b.onclick = () => {
      main.src = b.dataset.full;
      root.querySelectorAll(".var").forEach(x => x.classList.toggle("on", x === b));
    };
  });
}
/* 読み込み失敗時はモノグラムに差し替える（インライン属性だと引用符で壊れるためJSで付ける） */
function attachFallbacks(root){
  root.querySelectorAll("img").forEach(im => {
    im.onerror = () => {
      im.parentNode.innerHTML =
        `<div class="mono"><div class="ring"><span>${esc((im.alt||"?").slice(0,1))}</span></div>`
        + `<div class="cap">画像が見つかりません</div></div>`;
    };
    if (im.complete && im.naturalWidth === 0) im.onerror();
  });
}

function render(){
  renderTabs(); renderTags();
  viewList = filtered();
  $("#metaTtl").textContent = curQ.trim() ? "検索結果" : CAT_LABEL[curCat];
  $("#metaCnt").textContent = `${viewList.length} 件`;
  $("#grid").innerHTML = viewList.length ? viewList.map(d => `
    <article class="card" data-cat="${esc(d.category)}" data-id="${esc(d.id)}" tabindex="0">
      <span class="inner-rule"></span>
      <div class="thumb">${visual(d)}</div>
      <div class="card-body">
        <h3 class="card-name">${esc(d.name)}</h3>
        <div class="card-kana">${esc(d.kana||"")}</div>
        <p class="card-tl">${esc(d.tagline||"")}</p>
        <div class="card-chips">${(d.tags||[]).slice(0,3).map(t=>`<span class="mini">${esc(t)}</span>`).join("")}</div>
      </div>
    </article>`).join("")
    : `<div class="empty">該当する項目がありません</div>`;

  attachFallbacks($("#grid"));
  document.querySelectorAll(".card").forEach(c => {
    c.onclick = () => open(c.dataset.id);
    c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(c.dataset.id); } };
  });
}

function open(id){
  const i = viewList.findIndex(x => x.id === id);
  if (i < 0) return;
  const d = viewList[i];
  const el = $("#detail");
  el.dataset.cat = d.category;
  el.dataset.idx = i;
  el.innerHTML = `
    <div class="d-head">
      <div class="d-nav">
        <button id="prevB" title="前へ" ${i===0?"disabled":""}>‹</button>
        <button id="nextB" title="次へ" ${i===viewList.length-1?"disabled":""}>›</button>
        <button id="closeB" title="閉じる">✕</button>
      </div>
      <div class="cat">${esc(CAT_LABEL[d.category]||"")}</div>
      <h2>${esc(d.name)}</h2>
      <div class="kana">${esc(d.kana||"")}</div>
      ${d.tagline?`<p class="tl">── ${esc(d.tagline)} ──</p>`:""}
    </div>
    <div class="d-body">
      <div class="d-img"><div class="d-img-wrap">${visual(d, true)}${variantsHTML(d)}</div></div>
      <div class="d-info">
        <table>${(d.fields||[]).map(f=>`<tr><th>${esc(f.label)}</th><td>${esc(f.value)}</td></tr>`).join("")}</table>
        ${d.overview?`<div class="sect"><h3>概 要</h3><p>${esc(d.overview)}</p></div>`:""}
        ${d.quote   ?`<div class="sect"><h3>台 詞</h3><div class="quote">「${esc(d.quote)}」</div></div>`:""}
        ${d.note    ?`<div class="sect"><h3>備 考</h3><div class="note">${esc(d.note)}</div></div>`:""}
      </div>
    </div>`;
  attachFallbacks(el);
  bindVariants(el);
  $("#overlay").classList.add("open");
  $("#overlay").scrollTop = 0;
  document.body.style.overflow = "hidden";
  $("#closeB").onclick = close;
  $("#prevB").onclick  = () => { if (i>0) open(viewList[i-1].id); };
  $("#nextB").onclick  = () => { if (i<viewList.length-1) open(viewList[i+1].id); };
}
function close(){
  $("#overlay").classList.remove("open");
  document.body.style.overflow = "";
}

$("#overlay").onclick = e => { if (e.target.id === "overlay") close(); };
$("#q").oninput = e => { curQ = e.target.value; render(); };
document.addEventListener("keydown", e => {
  if (!$("#overlay").classList.contains("open")) return;
  const i = Number($("#detail").dataset.idx);
  if (e.key === "Escape")     close();
  if (e.key === "ArrowLeft"  && i>0) open(viewList[i-1].id);
  if (e.key === "ArrowRight" && i<viewList.length-1) open(viewList[i+1].id);
});

render();
</script>
</body>
</html>
