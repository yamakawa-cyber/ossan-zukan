<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:title" content="年表 ─ おっさん、人生ひと段落したので異世界で魔王を始めます ─ 世界図鑑">
<meta property="og:description" content="異世界32日間の日別年表とキャラの動き、世界のあゆみ。">
<meta property="og:url" content="https://yamakawa-cyber.github.io/ossan-zukan/年表.html">
<meta property="og:image" content="https://yamakawa-cyber.github.io/ossan-zukan/img/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="異世界32日間の日別年表とキャラの動き、世界のあゆみ。">
<title>おっさん年表 ─ 異世界32日間と世界のあゆみ</title>
<style>
:root{
  color-scheme: light;
  --surface:#fcfcfb; --page:#f9f9f7;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --g-family:#2a78d6; --g-guild:#eb6834; --g-town:#1baf7a;
  --g-army:#eda100; --g-south:#e87ba4; --g-other:#008300;
  --g-hero:#4a3aa7; --g-king:#e34948;
  --warn:#fab219; --accent:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface:#1a1a19; --page:#0d0d0d;
    --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --g-family:#3987e5; --g-guild:#d95926; --g-town:#199e70;
    --g-army:#c98500; --g-south:#d55181; --g-other:#008300;
    --g-hero:#9085e9; --g-king:#e66767;
    --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface:#1a1a19; --page:#0d0d0d;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --g-family:#3987e5; --g-guild:#d95926; --g-town:#199e70;
  --g-army:#c98500; --g-south:#d55181; --g-other:#008300;
  --g-hero:#9085e9; --g-king:#e66767;
  --accent:#3987e5;
}
*{box-sizing:border-box; margin:0; padding:0}
html{background:var(--page)}
body{background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI",Meiryo,sans-serif;
  font-size:15px; line-height:1.6}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}

/* ===== ヘッダー・タブ ===== */
header{position:sticky; top:0; z-index:50; background:var(--page);
  border-bottom:1px solid var(--grid); padding:8px 16px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap}
header h1{font-size:16px; font-weight:700}
header .sub{font-size:12px; color:var(--muted)}
nav.tabs{display:flex; gap:4px; margin-left:auto}
nav.tabs button{border:1px solid var(--grid); background:var(--surface); color:var(--ink2);
  padding:6px 14px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600}
nav.tabs button.active{background:var(--accent); border-color:var(--accent); color:#fff}
#themeBtn{border:1px solid var(--grid); background:var(--surface); color:var(--ink2);
  border-radius:8px; padding:6px 10px; cursor:pointer; font-size:13px}
main{max-width:1400px; margin:0 auto; padding:16px}
section.tab{display:none}
section.tab.active{display:block}

.badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
  padding:1px 8px; border-radius:999px; border:1px solid var(--ring); color:var(--ink2);
  background:var(--surface); white-space:nowrap}
.badge.uncertain{border:1.5px dashed var(--warn); color:var(--ink2)}
.badge.danshou{border-style:dotted; border-color:var(--ink2)}
.dot{width:9px; height:9px; border-radius:3px; display:inline-block; flex:none}

/* ===== スライドショー ===== */
#slideNav{display:flex; gap:3px; flex-wrap:wrap; margin-bottom:10px; align-items:flex-end}
#slideNav .cell{width:26px; height:26px; border-radius:6px; border:1px solid var(--grid);
  background:var(--surface); cursor:pointer; font-size:10px; color:var(--muted);
  display:flex; align-items:center; justify-content:center; position:relative}
#slideNav .cell .bar{position:absolute; bottom:2px; left:3px; right:3px; height:3px; border-radius:2px; background:var(--axis)}
#slideNav .cell.cur{border:2px solid var(--accent); color:var(--ink); font-weight:700}
#slideNav .arcLabel{font-size:10px; color:var(--muted); width:100%; margin-top:6px}
.slideHead{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin:10px 0 2px}
.slideHead .dayNum{font-size:44px; font-weight:800; line-height:1}
.slideHead .dayNum small{font-size:16px; font-weight:600; color:var(--muted)}
.slideHead h2{font-size:24px; font-weight:800}
.slideHead .sub{color:var(--ink2); font-size:14px}
.slideMeta{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 14px; align-items:center}
.slideBody{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:10px}
.charCard{background:var(--surface); border:1px solid var(--grid); border-radius:10px; padding:10px 12px}
.charCard .cname{display:flex; align-items:center; gap:7px; font-weight:700; font-size:14px; margin-bottom:4px}
.charCard ul{list-style:none}
.charCard li{font-size:13px; color:var(--ink2); padding:2px 0; display:flex; gap:6px; align-items:baseline}
.charCard li .ep{font-size:10px; color:var(--muted); flex:none; margin-left:auto; padding-left:8px; white-space:nowrap}
.charCard li.unc::before{content:"推定"; font-size:9px; border:1px dashed var(--warn); border-radius:4px;
  padding:0 3px; color:var(--ink2); flex:none; align-self:center}
.charCard li.dan::before{content:"断章"; font-size:9px; border:1px dotted var(--ink2); border-radius:4px;
  padding:0 3px; color:var(--ink2); flex:none; align-self:center}
.slideCtrl{position:fixed; bottom:18px; right:18px; display:flex; gap:8px; z-index:40}
.slideCtrl button{width:44px; height:44px; border-radius:50%; border:1px solid var(--grid);
  background:var(--surface); color:var(--ink); font-size:18px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.15)}
.slideCtrl button:hover{border-color:var(--accent)}
.arcChip{font-size:12px; font-weight:700; color:var(--accent); letter-spacing:.05em}

/* ===== スイムレーン ===== */
.laneTools{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.laneTools input[type=text]{background:var(--surface); border:1px solid var(--grid); color:var(--ink);
  border-radius:8px; padding:6px 10px; font-size:13px; width:180px}
.laneTools label{font-size:12px; color:var(--ink2); display:flex; gap:4px; align-items:center; cursor:pointer}
.gToggle{display:flex; gap:4px; flex-wrap:wrap}
.gToggle button{border:1px solid var(--grid); background:var(--surface); color:var(--ink2);
  border-radius:999px; padding:3px 10px; font-size:12px; cursor:pointer; display:flex; gap:5px; align-items:center}
.gToggle button.off{opacity:.35}
#laneWrap{overflow:auto; max-height:calc(100vh - 210px); border:1px solid var(--grid); border-radius:10px; background:var(--surface)}
table.lane{border-collapse:separate; border-spacing:0; font-size:12px}
table.lane th, table.lane td{border-bottom:1px solid var(--grid); border-right:1px solid var(--grid); padding:0}
table.lane thead th{position:sticky; top:0; z-index:3; background:var(--surface); font-weight:600; color:var(--ink2)}
table.lane thead tr.eps th{top:0; height:20px; font-size:9px; color:var(--muted); font-weight:500}
table.lane thead tr.days th{top:20px; height:24px; font-size:11px; cursor:pointer}
table.lane thead tr.days th:hover{color:var(--accent)}
table.lane thead tr.days th.wk{color:var(--g-army); font-weight:800}
table.lane th.name{position:sticky; left:0; z-index:2; background:var(--surface); text-align:left;
  padding:0 10px; min-width:150px; max-width:190px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
table.lane thead th.corner{left:0; z-index:5}
table.lane td.c{width:26px; min-width:26px; height:24px; text-align:center; vertical-align:middle}
table.lane td.c .pill{width:18px; height:14px; border-radius:4px; margin:0 auto; display:flex;
  align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff; cursor:pointer}
table.lane td.c .pill.unc{outline:2px dashed var(--warn); outline-offset:-1px}
table.lane td.c:hover{background:color-mix(in oklab, var(--accent) 12%, transparent)}
table.lane td.c{position:relative}
table.lane td.c .sp{position:absolute; top:5px; bottom:5px; left:0; right:0; cursor:pointer;
  background:color-mix(in oklab, var(--spc) 20%, transparent);
  border-top:1.5px dashed var(--spc); border-bottom:1.5px dashed var(--spc)}
table.lane td.c .sp.solid{border-top-style:solid; border-bottom-style:solid;
  background:color-mix(in oklab, var(--spc) 32%, transparent)}
table.lane td.c .sp.first{border-left:1.5px dashed var(--spc); border-radius:7px 0 0 7px}
table.lane td.c .sp.solid.first{border-left-style:solid}
table.lane td.c .sp.last{border-right:1.5px dashed var(--spc); border-radius:0 7px 7px 0}
table.lane td.c .sp.solid.last{border-right-style:solid}
table.lane td.c .spLabel{position:absolute; left:4px; top:50%; transform:translateY(-50%);
  font-size:9px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  z-index:1; pointer-events:none; text-align:left}
/* スライドの並行ストリップ */
.paraStrip{margin-top:16px; border-top:1px dashed var(--grid); padding-top:8px}
.paraStrip h3{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:6px}
.paraStrip .chips{display:flex; flex-wrap:wrap; gap:6px}
.paraChip{font-size:12px; color:var(--ink2); background:var(--surface); border:1px dashed var(--ring);
  border-left:3px solid var(--spc); border-radius:8px; padding:3px 10px; max-width:480px}
.paraChip b{color:var(--ink)}
.paraChip.solid{border-style:solid}
table.lane tr.grpHead th{background:color-mix(in oklab, var(--surface) 88%, var(--ink) 12%); color:var(--ink);
  font-size:11px; letter-spacing:.06em; padding:2px 10px}
#laneDetail{margin-top:10px; background:var(--surface); border:1px solid var(--grid); border-radius:10px;
  padding:10px 14px; display:none}
#laneDetail.show{display:block}
#laneDetail h3{font-size:14px; display:flex; gap:8px; align-items:center}
#laneDetail ul{list-style:none; margin-top:4px}
#laneDetail li{font-size:13px; color:var(--ink2); padding:2px 0}
#laneDetail li .ep{color:var(--muted); font-size:11px}

/* ===== 世界年表 ===== */
.worldIntro{font-size:13px; color:var(--ink2); margin-bottom:14px; max-width:820px}
.era{margin-bottom:22px; max-width:900px}
.era > h2{font-size:17px; font-weight:800; display:flex; align-items:baseline; gap:10px; margin-bottom:6px}
.era > h2 .when{font-size:12px; color:var(--muted); font-weight:600}
.era .events{border-left:3px solid var(--accent); margin-left:6px; padding-left:16px; display:flex; flex-direction:column; gap:8px}
.era.parallel .events{border-left-color:var(--g-south)}
.era.future .events{border-left-style:dashed}
.wev{background:var(--surface); border:1px solid var(--grid); border-radius:10px; padding:8px 12px; position:relative}
.wev::before{content:""; position:absolute; left:-21.5px; top:14px; width:8px; height:8px; border-radius:50%;
  background:var(--accent); border:2px solid var(--page)}
.era.parallel .wev::before{background:var(--g-south)}
.wev p{font-size:13.5px}
.wev .src{font-size:11px; color:var(--muted); margin-top:2px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.tag{font-size:10px; border:1px solid var(--ring); border-radius:4px; padding:0 5px; color:var(--muted)}
.tag.unposted{border-color:var(--g-south); color:var(--g-south)}
.tag.warn{border:1px solid var(--warn); color:var(--ink2)}
.tag.warn::before{content:"⚠ "}

/* ===== 検算メモ ===== */
.memoGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px}
.memoCard{background:var(--surface); border:1px solid var(--grid); border-radius:12px; padding:12px 16px}
.memoCard h2{font-size:15px; margin-bottom:8px}
.memoCard ul{list-style:none}
.memoCard li{font-size:13px; color:var(--ink2); padding:4px 0; border-top:1px dashed var(--grid)}
.memoCard li:first-child{border-top:none}
.memoCard.issues li::before{content:"⚠ "; color:var(--warn)}
.legendRow{display:flex; gap:12px; flex-wrap:wrap; margin:4px 0 16px; font-size:12px; color:var(--ink2)}
.legendRow span{display:flex; gap:5px; align-items:center}
@media print{ header{position:static} .slideCtrl{display:none} #laneWrap{max-height:none; overflow:visible} }

/* ══════════ 図鑑ポップアップ(魔王図鑑のモーダルを移植・常に紙色) ══════════ */
.zk-click{cursor:pointer; border-bottom:1px dotted currentColor}
.zk-click:hover{color:var(--accent); border-bottom-style:solid}
#zkOverlay{
  position:fixed; inset:0; z-index:100; display:none;
  background:rgba(30,26,18,.42); backdrop-filter:blur(5px);
  overflow-y:auto; padding:clamp(16px,4vw,52px) clamp(12px,3vw,24px);
}
#zkOverlay.open{display:block}
.zk-detail{
  --zacc:#9a7b32; --zink:#2a2622; --zink2:#4c463c; --zmuted:#6b6355; --zfaint:#9a917f;
  --zhair:#e8e2d2; --zhair2:#d9d0b8;
  --zserif:"Yu Mincho",YuMincho,"Hiragino Mincho ProN","Noto Serif JP",serif;
  width:100%; max-width:980px; margin:0 auto; position:relative;
  background:#fff; border:1px solid var(--zhair2); color:var(--zink);
  box-shadow:0 18px 60px rgba(0,0,0,.28); animation:zkRise .3s cubic-bezier(.22,.61,.36,1);
}
.zk-detail::before{content:""; position:absolute; left:-1px; right:-1px; top:-1px; height:4px; background:var(--zacc)}
@keyframes zkRise{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}
.zk-head{padding:34px 36px 24px; border-bottom:1px solid var(--zhair); text-align:center; position:relative}
.zk-head .zcat{font-family:var(--zserif); font-size:10px; letter-spacing:.32em; text-indent:.32em; color:var(--zacc); margin-bottom:13px}
.zk-head h2{font-family:var(--zserif); font-weight:600; font-size:clamp(23px,3.4vw,33px); letter-spacing:.13em; text-indent:.13em; color:var(--zink)}
.zk-head .zkana{font-size:11px; letter-spacing:.26em; color:var(--zfaint); margin-top:8px; font-family:var(--zserif)}
.zk-head .ztl{margin:17px auto 0; max-width:620px; font-family:var(--zserif); font-size:13.5px; color:var(--zmuted); letter-spacing:.08em}
.zk-close{position:absolute; top:16px; right:16px; width:34px; height:34px; background:#fff; cursor:pointer;
  border:1px solid var(--zhair2); color:var(--zacc); font-size:15px; line-height:1; border-radius:2px}
.zk-close:hover{background:var(--zacc); color:#fff; border-color:var(--zacc)}
.zk-body{display:grid; grid-template-columns:318px 1fr}
@media(max-width:780px){.zk-body{grid-template-columns:1fr}}
.zk-img{border-right:1px solid var(--zhair); padding:24px;
  background:repeating-linear-gradient(45deg,rgba(154,123,50,.03) 0 1px,transparent 1px 9px),linear-gradient(170deg,#faf7f0,#f1ece1);
  display:flex; align-items:flex-start; justify-content:center}
@media(max-width:780px){.zk-img{border-right:none; border-bottom:1px solid var(--zhair)}}
.zk-img-wrap{width:100%}
.zk-img img{width:100%; display:block; border:1px solid var(--zhair2); box-shadow:0 2px 8px rgba(0,0,0,.08)}
.zk-mono{display:flex; flex-direction:column; align-items:center; gap:14px; padding:60px 0}
.zk-mono .zring{width:70px; height:70px; display:grid; place-items:center; position:relative;
  border:1px solid rgba(154,123,50,.45); transform:rotate(45deg); background:rgba(255,255,255,.6)}
.zk-mono .zring span{transform:rotate(-45deg); font-family:var(--zserif); font-size:27px; color:rgba(154,123,50,.85)}
.zk-mono .zcap{font-family:var(--zserif); font-size:10px; letter-spacing:.24em; color:var(--zfaint)}
.zk-vars{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.zk-var{cursor:pointer; background:#fff; border:1px solid var(--zhair2); border-radius:2px; padding:0; overflow:hidden; width:62px}
.zk-var img{width:100%; height:74px; object-fit:cover; object-position:center 15%; display:block; border:0; box-shadow:none}
.zk-var .zvlab{font-family:var(--zserif); font-size:9px; color:var(--zmuted); padding:3px 2px; text-align:center; line-height:1.3; border-top:1px solid var(--zhair)}
.zk-var:hover{border-color:var(--zacc)}
.zk-var.on{border-color:var(--zacc); box-shadow:0 0 0 2px rgba(154,123,50,.28)}
.zk-info{padding:28px 32px 36px}
.zk-info table{width:100%; border-collapse:collapse; font-size:13.5px}
.zk-info th,.zk-info td{text-align:left; vertical-align:top; padding:10px 4px; border-bottom:1px solid var(--zhair)}
.zk-info th{width:94px; white-space:nowrap; font-weight:400; font-family:var(--zserif); font-size:12.5px; letter-spacing:.12em; color:var(--zacc)}
.zk-info td{color:var(--zink2); line-height:1.85}
.zk-sect{margin-top:28px}
.zk-sect h3{font-family:var(--zserif); font-weight:500; font-size:12px; letter-spacing:.28em; text-indent:.28em;
  color:var(--zacc); margin-bottom:12px; display:flex; align-items:center; gap:12px}
.zk-sect h3::after{content:""; flex:1; height:1px; background:var(--zhair)}
.zk-sect p{font-size:13.5px; line-height:2.1; color:var(--zink2)}
.zk-quote{font-family:var(--zserif); font-size:17px; line-height:2; color:var(--zink);
  padding:18px 22px; border-left:3px solid var(--zacc);
  background:linear-gradient(90deg,rgba(154,123,50,.06),transparent)}
.zk-note{font-size:12.5px; line-height:2; color:var(--zmuted); padding:15px 18px; background:#faf7f0; border:1px solid var(--zhair)}
</style>
</head>
<body>
<header>
  <div>
    <h1>おっさん年表</h1>
    <div class="sub">第1話〜第74話+断章 ── 異世界32日間 / 生成 2026-08-12・本文が唯一の正</div>
  </div>
  <nav class="tabs">
    <button data-tab="slide" class="active">スライドショー</button>
    <button data-tab="lane">スイムレーン</button>
    <button data-tab="world">世界年表</button>
    <button data-tab="memo">検算メモ</button>
  </nav>
  <nav class="tabs" style="margin-left:0">
    <a href="index.html" class="tab" style="text-decoration:none;display:inline-flex;align-items:center;border:1px solid var(--grid);background:var(--surface);color:var(--ink2);padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600">図 鑑</a>
    <a href="episodes.html" class="tab" style="text-decoration:none;display:inline-flex;align-items:center;border:1px solid var(--grid);background:var(--surface);color:var(--ink2);padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600">各話まとめ</a>
    <a href="map.html" class="tab" style="text-decoration:none;display:inline-flex;align-items:center;border:1px solid var(--grid);background:var(--surface);color:var(--ink2);padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600">世 界 地 図</a>
  </nav>
  <button id="themeBtn" title="テーマ切替">◐</button>
</header>
<main>

<section id="tab-slide" class="tab active">
  <div id="slideNav"></div>
  <div class="legendRow" id="legendSlide"></div>
  <div id="slideView"></div>
  <div class="slideCtrl">
    <button id="prevBtn" title="前の日 (←)">←</button>
    <button id="nextBtn" title="次の日 (→)">→</button>
  </div>
</section>

<section id="tab-lane" class="tab">
  <div class="laneTools">
    <input type="text" id="laneSearch" placeholder="キャラ検索…">
    <div class="gToggle" id="gToggle"></div>
    <label><input type="checkbox" id="hideMinor">登場1日だけのキャラを隠す</label>
  </div>
  <div id="laneWrap"></div>
  <div id="laneDetail"></div>
</section>

<section id="tab-world" class="tab">
  <p class="worldIntro">物語開始以前を含む世界そのものの年表。出典は各話・英雄譚・断章・真魔の章。
  <span class="tag unposted">未投稿</span> は未投稿原稿由来、<span class="tag warn">要注意</span> は本文間に揺れがある項目。</p>
  <div id="worldView"></div>
</section>

<section id="tab-memo" class="tab">
  <div class="memoGrid" id="memoView"></div>
</section>

</main>

/* 年表のキャラ名 → 図鑑id(zukan_data.js)。登録キャラのみクリック可能 */
const CHAR2ZUKAN = {
  'アクロス':'acros','リーネ':'rine','クロ':'kuro','フレス':'fres','佐伯航':'wataru',
  'ファルティシア':'faltisia','フィル':'fil','ドルク':'dolk','ガドラ':'gadora','ヴォス':'vos',
  'オルガ':'olga','カイ':'kai','ミラ':'mira','ハンナ':'hanna','ゲルツ':'gerutsu',
  'マルコ':'marco','レナ':'rena','エミラ':'emira','トマス':'thomas','エリー':'ellie',
  'ギース':'geese','ウェイン':'wayne','マグナティア':'magnatia','ラーナ':'larna',
  'ギリアム':'gilliam','フルクス':'flux','パメラ':'pamela','ティグリス':'tigris',
  'アリア(旧アリシア)':'alicia','セルジュ':'serge','エレーナ':'elena','フォビアン':'fobian',
  'グレイヴァル(宰相)':'graveal','ヴァイス(剣聖)':'vice','ルカ':'luca',
};
const zesc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ZCAT = {character:'人 物', monster:'魔 物', term:'用 語'};
function zkIdOf(name){
  const id = CHAR2ZUKAN[name];
  if(!id) return null;
  return (window.ZUKAN_DATA||[]).some(z=>z.id===id) ? id : null;
}
/* 名前をクリック可能なHTMLに(図鑑登録キャラのみ) */
function zkName(name){
  const id = zkIdOf(name);
  return id ? `<span class="zk-click" data-zk="${id}" title="図鑑で見る" role="button" tabindex="0">${zesc(name)}</span>` : zesc(name);
}
function zkBindClicks(root){
  root.querySelectorAll('.zk-click[data-zk]').forEach(el=>{
    el.onclick = e => { e.stopPropagation(); zkOpen(el.dataset.zk); };
    el.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); zkOpen(el.dataset.zk); } };
  });
}
/* img:"char/アクロス_確定" → 一覧はサムネ(jpg)、詳細は原寸(png) */
function imgPaths(d){
  if (!d.img) return null;
  const i = d.img.indexOf("/");
  const dir = d.img.slice(0, i), file = d.img.slice(i + 1);
  return {
    thumb: "img/thumb/" + dir + "/" + encodeURIComponent(file) + ".jpg",
    full:  "img/full/"  + dir + "/" + encodeURIComponent(file) + ".jpg"
  };
}
function zkMono(d, cap){
  return `<div class="zk-mono"><div class="zring"><span>${zesc((d.name||'?').slice(0,1))}</span></div><div class="zcap">${zesc(cap)}</div></div>`;
}
function zkVisual(d){
  const p = imgPaths(d);
  if(!p) return zkMono(d,'イラスト未設定');
  return `<img src="${p.full}" data-alt2="../${p.full}" alt="${zesc(d.name)}" loading="lazy">`;
}
function zkVariants(d){
  if(!d.variants || d.variants.length < 2) return '';
  return `<div class="zk-vars">` + d.variants.map((v,i)=>{
    const p = imgPaths({img:v.img});
    return `<button class="zk-var${i===0?' on':''}" data-full="${p.full}" title="${zesc(v.label)}">`
      + `<img src="${p.thumb}" data-alt2="../${p.thumb}" alt="${zesc(v.label)}">`
      + `<div class="zvlab">${zesc(v.label)}</div></button>`;
  }).join('') + `</div>`;
}
/* 読み込み失敗時: 一段上の相対パス(プロジェクト用まとめ配置用)を試し、だめならモノグラム */
function zkFallbacks(root){
  root.querySelectorAll('img').forEach(im=>{
    im.onerror = () => {
      const alt2 = im.dataset.alt2;
      if(alt2){ im.removeAttribute('data-alt2'); im.src = alt2; return; }
      im.onerror = null;
      im.parentNode.innerHTML = `<div class="zk-mono"><div class="zring"><span>${zesc((im.alt||'?').slice(0,1))}</span></div><div class="zcap">画像が見つかりません</div></div>`;
    };
    if(im.complete && im.naturalWidth===0) im.onerror();
  });
}
function zkOpen(id){
  const d = (window.ZUKAN_DATA||[]).find(x=>x.id===id);
  if(!d) return;
  const el = document.getElementById('zkDetail');
  el.innerHTML = `
    <div class="zk-head">
      <button class="zk-close" id="zkCloseB" title="閉じる">✕</button>
      <div class="zcat">${ZCAT[d.category]||''}</div>
      <h2>${zesc(d.name)}</h2>
      <div class="zkana">${zesc(d.kana||'')}</div>
      ${d.tagline?`<p class="ztl">── ${zesc(d.tagline)} ──</p>`:''}
    </div>
    <div class="zk-body"${d.category==='term'?' style="grid-template-columns:1fr"':''}>
      ${d.category==='term'?'':`<div class="zk-img"><div class="zk-img-wrap">${zkVisual(d)}${zkVariants(d)}</div></div>`}
      <div class="zk-info">
        <table>${(d.fields||[]).map(f=>`<tr><th>${zesc(f.label)}</th><td>${zesc(f.value)}</td></tr>`).join('')}</table>
        ${d.overview?`<div class="zk-sect"><h3>概 要</h3><p>${zesc(d.overview)}</p></div>`:''}
        ${d.quote?`<div class="zk-sect"><h3>台 詞</h3><div class="zk-quote">「${zesc(d.quote)}」</div></div>`:''}
        ${d.note?`<div class="zk-sect"><h3>備 考</h3><div class="zk-note">${zesc(d.note)}</div></div>`:''}
      </div>
    </div>`;
  zkFallbacks(el);
  const main = el.querySelector('.zk-img-wrap > img');
  el.querySelectorAll('.zk-var').forEach(b=>{
    b.onclick = () => {
      if(main) main.src = b.dataset.full;
      el.querySelectorAll('.zk-var').forEach(x=>x.classList.toggle('on',x===b));
    };
  });
  document.getElementById('zkCloseB').onclick = zkClose;
  document.getElementById('zkOverlay').classList.add('open');
  document.getElementById('zkOverlay').scrollTop = 0;
}
function zkClose(){ document.getElementById('zkOverlay').classList.remove('open'); }
document.getElementById('zkOverlay').onclick = e => { if(e.target.id==='zkOverlay') zkClose(); };
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && document.getElementById('zkOverlay').classList.contains('open')) zkClose();
});
const groupOf = n => GROUPS.find(g=>g.names.includes(n)) || GROUPS[GROUPS.length-1];

/* ===== 章区分(クロード付与) ===== */
const ARCS = [
 {from:0,to:0,label:'転生前'},
 {from:1,to:14,label:'森の日々'},
 {from:15,to:16,label:'グラザへの旅'},
 {from:17,to:20,label:'グラザの日々'},
 {from:21,to:23,label:'魔狼討伐'},
 {from:24,to:28,label:'稽古と日常'},
 {from:29,to:31,label:'浄化遠征'},
 {from:32,to:32,label:'新しい日常'},
];
const arcOf = d => ARCS.find(a=>d>=a.from&&d<=a.to);

const days = DATA.days;
const dayByNum = new Map(days.map(d=>[d.day,d]));
const MAXEV = Math.max(...days.map(d=>d.events.length));

/* ===== レーン用キャラ順(グループ→登場数) ===== */
const laneChars = [...DATA.chars].sort((a,b)=>{
  const ga=GROUPS.indexOf(groupOf(a.name)), gb=GROUPS.indexOf(groupOf(b.name));
  return ga-gb || b.count-a.count;
});
/* day×char 索引 */
const cellIdx = new Map(); // name -> Map(day -> events[])
for(const d of days) for(const ev of d.events){
  if(!cellIdx.has(ev.char)) cellIdx.set(ev.char, new Map());
  const m = cellIdx.get(ev.char);
  if(!m.has(d.day)) m.set(d.day, []);
  m.get(d.day).push(ev);
}

/* ===== タブ ===== */
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('active',x===b));
    document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('active',s.id==='tab-'+b.dataset.tab));
  };
});
function gotoTab(key){ document.querySelector(`nav.tabs button[data-tab="${key}"]`).click(); }

/* ===== テーマ ===== */
document.getElementById('themeBtn').onclick=()=>{
  const r=document.documentElement;
  const cur=r.dataset.theme||'auto';
  const dark=matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = cur==='auto' ? (dark?'light':'dark') : (cur==='dark'?'light':'dark');
};

/* ===== 凡例 ===== */
document.getElementById('legendSlide').innerHTML =
  GROUPS.map(g=>`<span><i class="dot" style="background:${g.color}"></i>${g.label}</span>`).join('') +
  `<span><i class="badge uncertain" style="font-size:9px">推定</i>日付に推定を含む</span>` +
  `<span><i class="badge danshou" style="font-size:9px">断章</i>断章由来</span>` +
  `<span style="border-top:1.5px dashed var(--muted);padding-top:1px">点線帯=日付未確定の並行動向(勇者一行・王国勢)</span>` +
  `<span><i class="zk-click" style="font-style:normal">名前</i>をクリック=図鑑ポップアップ</span>`;

/* ===== スライドショー ===== */
let cur = 1;
function buildNav(){
  const nav = document.getElementById('slideNav');
  let html='';
  for(const a of ARCS){
    html += `<div style="display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;gap:3px">`;
    for(let d=a.from; d<=a.to; d++){
      const dd = dayByNum.get(d);
      const h = dd ? Math.max(3, Math.round(dd.events.length/MAXEV*16)) : 3;
      html += `<div class="cell${d===cur?' cur':''}" data-day="${d}" title="${d===0?'転生前':d+'日目'} ${dd?dd.title:''}">${d}<div class="bar" style="height:${h}px"></div></div>`;
    }
    html += `</div><div class="arcLabel">${a.label}</div></div>`;
  }
  nav.innerHTML = html;
  nav.querySelectorAll('.cell').forEach(c=>c.onclick=()=>show(+c.dataset.day));
}
function show(d){
  if(!dayByNum.has(d)) return;
  cur=d;
  const dd = dayByNum.get(d);
  const arc = arcOf(d);
  /* キャラごとにまとめ(レーン順) */
  const per = new Map();
  for(const ev of dd.events){
    if(!per.has(ev.char)) per.set(ev.char, []);
    per.get(ev.char).push(ev);
  }
  const ordered = laneChars.filter(c=>per.has(c.name));
  const epsHtml = dd.eps.map(e=>{
    const label = `${e.no}「${e.title}」`;
    return e.url ? `<a class="badge" href="${e.url}" target="_blank" title="カクヨムで開く">${label}</a>`
                 : `<span class="badge" title="未投稿/ローカル">${label}</span>`;
  }).join('');
  document.getElementById('slideView').innerHTML = `
    <div class="slideHead">
      <span class="arcChip">${arc.label}</span>
      <span class="dayNum">${d===0?'前日譚':d}<small>${d===0?'':' 日目'}</small></span>
      <div>
        <h2>${dd.title}${dd.weekday?` <span class="badge" style="border-color:var(--g-army);color:var(--g-army)">${dd.weekday}</span>`:''}</h2>
        <div class="sub">${dd.sub||''}</div>
      </div>
    </div>
    <div class="slideMeta">
      ${dd.locations.map(l=>`<span class="badge">📍 ${l}</span>`).join('')}
      ${epsHtml}
    </div>
    <div class="slideBody">
      ${ordered.map(c=>{
        const g=groupOf(c.name);
        const evs=per.get(c.name);
        return `<div class="charCard" style="border-left:4px solid ${g.color}">
          <div class="cname"><i class="dot" style="background:${g.color}"></i>${zkName(c.name)}</div>
          <ul>${evs.map(e=>`<li class="${e.uncertain?'unc':''}${e.kind==='danshou'?' dan':''}"><span>${e.text}</span><span class="ep">${e.ep}</span></li>`).join('')}</ul>
        </div>`;
      }).join('')}
    </div>
    ${(()=>{ /* 並行する動き(日付未確定の帯) */
      const chips=[];
      for(const p of PARA){
        for(const s of p.spans||[]){
          if(d>=s.from && d<=s.to){
            const g=groupOf(p.char);
            chips.push(`<span class="paraChip${s.solid?' solid':''}" style="--spc:${g.color}" title="出典: ${s.src}(${s.from}〜${s.to}日目${s.solid?'・準確定':'・日付推定'})"><b>${p.char}</b> ─ ${s.text}</span>`);
          }
        }
      }
      return chips.length?`<div class="paraStrip"><h3>同じ頃、大陸では ── 日付は確定せず(整理用・点線=推定)</h3><div class="chips">${chips.join('')}</div></div>`:'';
    })()}`;
  zkBindClicks(document.getElementById('slideView'));
  buildNav();
  window.scrollTo({top:0});
}
document.getElementById('prevBtn').onclick=()=>show(Math.max(0,cur-1));
document.getElementById('nextBtn').onclick=()=>show(Math.min(32,cur+1));
addEventListener('keydown',e=>{
  if(document.getElementById('zkOverlay').classList.contains('open')) return;
  if(!document.getElementById('tab-slide').classList.contains('active')) return;
  if(e.key==='ArrowLeft') show(Math.max(0,cur-1));
  if(e.key==='ArrowRight') show(Math.min(32,cur+1));
  if(e.key==='Home') show(0);
  if(e.key==='End') show(32);
});

/* ===== スイムレーン ===== */
const laneState={q:'', groups:new Set(GROUPS.map(g=>g.key)), hideMinor:false};
function epsLabel(d){
  const mains=d.eps.filter(e=>e.kind==='main').map(e=>parseInt(e.no.replace(/[^0-9]/g,''))).sort((a,b)=>a-b);
  if(!mains.length) return '';
  return mains.length===1? String(mains[0]) : mains[0]+'-'+mains[mains.length-1];
}
function buildLane(){
  const rows=[];
  let lastG=null;
  for(const c of laneChars){
    const g=groupOf(c.name);
    if(!laneState.groups.has(g.key)) continue;
    if(laneState.q && !c.name.includes(laneState.q)) continue;
    if(laneState.hideMinor && c.dayCount<2 && !paraMap.has(c.name)) continue;
    if(g!==lastG){ rows.push({head:g}); lastG=g; }
    rows.push({char:c, g});
  }
  const dayList=days.map(d=>d.day);
  let html='<table class="lane"><thead>';
  html+='<tr class="eps"><th class="name corner">話</th>'+dayList.map(dn=>`<th>${epsLabel(dayByNum.get(dn))}</th>`).join('')+'</tr>';
  html+='<tr class="days"><th class="name corner">キャラ＼日</th>'+dayList.map(dn=>{
    const dd=dayByNum.get(dn);
    return `<th class="${dd.weekday?'wk':''}" data-day="${dn}" title="${dn===0?'転生前':dn+'日目'} ${dd.title}${dd.weekday?' ['+dd.weekday+']':''}">${dn===0?'前':dn}</th>`;
  }).join('')+'</tr></thead><tbody>';
  for(const r of rows){
    if(r.head){
      html+=`<tr class="grpHead"><th class="name" style="border-left:4px solid ${r.head.color}">${r.head.label}</th><th colspan="${dayList.length}"></th></tr>`;
      continue;
    }
    const m=cellIdx.get(r.char.name)||new Map();
    const spans=(paraMap.get(r.char.name)||{}).spans||[];
    html+=`<tr><th class="name" title="${r.char.name} ─ 登場${r.char.dayCount}日/${r.char.count}件${spans.length?'(点線帯=日付未確定の動向)':''}">${zkName(r.char.name)}</th>`;
    for(const dn of dayList){
      const evs=m.get(dn);
      if(evs){
        const unc=evs.some(e=>e.uncertain);
        const tip=(dn===0?'転生前':dn+'日目')+' '+r.char.name+'\n'+evs.map(e=>'・'+e.text+'('+e.ep+')').join('\n');
        html+=`<td class="c"><div class="pill${unc?' unc':''}" style="background:${r.g.color}" data-char="${r.char.name}" data-day="${dn}" title="${tip.replace(/"/g,'&quot;')}">${evs.length>1?evs.length:''}</div></td>`;
        continue;
      }
      /* 帯(複数が重なる日は限定的な方=後勝ち) */
      const covering=spans.filter(s=>dn>=s.from&&dn<=s.to);
      if(covering.length){
        const s=covering[covering.length-1];
        const cls='sp'+(s.solid?' solid':'')+(dn===s.from?' first':'')+(dn===s.to?' last':'');
        const tip=`${s.from}〜${s.to}日目(${s.solid?'準確定':'日付推定'}) ${r.char.name}\n${s.text}\n出典: ${s.src}`;
        const label=(dn===s.from)?`<div class="spLabel" style="width:${(s.to-s.from+1)*26-8}px">${s.text}</div>`:'';
        html+=`<td class="c"><div class="${cls}" style="--spc:${r.g.color}" data-char="${r.char.name}" data-sfrom="${s.from}" title="${tip.replace(/"/g,'&quot;')}"></div>${label}</td>`;
        continue;
      }
      html+='<td class="c"></td>';
    }
    html+='</tr>';
  }
  html+='</tbody></table>';
  const wrap=document.getElementById('laneWrap');
  wrap.innerHTML=html;
  wrap.querySelectorAll('.pill').forEach(p=>p.onclick=()=>showDetail(p.dataset.char,+p.dataset.day));
  wrap.querySelectorAll('.sp').forEach(p=>p.onclick=()=>showSpanDetail(p.dataset.char,+p.dataset.sfrom));
  zkBindClicks(wrap);
  wrap.querySelectorAll('tr.days th[data-day]').forEach(th=>th.onclick=()=>{gotoTab('slide'); show(+th.dataset.day);});
}
function showDetail(name,dn){
  const evs=(cellIdx.get(name)||new Map()).get(dn)||[];
  const g=groupOf(name);
  const dd=dayByNum.get(dn);
  const el=document.getElementById('laneDetail');
  el.className='show';
  el.innerHTML=`<h3><i class="dot" style="background:${g.color}"></i>${zkName(name)} ─ ${dn===0?'転生前':dn+'日目'}「${dd.title}」
    <a href="#" onclick="gotoTab('slide');show(${dn});return false" style="font-size:12px;margin-left:auto">この日のスライドへ →</a></h3>
    <ul>${evs.map(e=>`<li>・${e.text} <span class="ep">(${e.ep}「${e.title}」${e.kind==='danshou'?'・断章':''}${e.uncertain?'・日付推定':''})</span></li>`).join('')}</ul>`;
  zkBindClicks(el);
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function showSpanDetail(name,from){
  const p=paraMap.get(name); if(!p) return;
  const s=p.spans.find(x=>x.from===from); if(!s) return;
  const g=groupOf(name);
  const el=document.getElementById('laneDetail');
  el.className='show';
  el.innerHTML=`<h3><i class="dot" style="background:${g.color}"></i>${zkName(name)} ─ ${s.from}〜${s.to}日目
    <span class="badge ${s.solid?'':'uncertain'}" style="margin-left:6px">${s.solid?'準確定(観測記録)':'日付未確定・整理用'}</span></h3>
    <ul><li>・${s.text} <span class="ep">(出典: ${s.src})</span></li></ul>`;
  zkBindClicks(el);
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
document.getElementById('laneSearch').oninput=e=>{laneState.q=e.target.value.trim(); buildLane();};
document.getElementById('hideMinor').onchange=e=>{laneState.hideMinor=e.target.checked; buildLane();};
document.getElementById('gToggle').innerHTML=GROUPS.map(g=>
  `<button data-g="${g.key}"><i class="dot" style="background:${g.color}"></i>${g.label}</button>`).join('');
document.querySelectorAll('#gToggle button').forEach(b=>b.onclick=()=>{
  const k=b.dataset.g;
  if(laneState.groups.has(k)) laneState.groups.delete(k); else laneState.groups.add(k);
  b.classList.toggle('off',!laneState.groups.has(k));
  buildLane();
});

/* ===== 世界年表 ===== */
function buildWorld(){
  const w=DATA.world;
  document.getElementById('worldView').innerHTML = w.eras.map(era=>{
    const cls = era.era==='本編と並行' ? 'parallel' : (era.era==='予告された未来' ? 'future parallel' : '');
    return `<div class="era ${cls}">
      <h2>${era.era}<span class="when">${era.when}</span></h2>
      <div class="events">${era.events.map(ev=>`
        <div class="wev"><p>${ev.t}</p>
          <div class="src"><span class="tag">出典: ${ev.src}</span>
          ${ev.posted===false?'<span class="tag unposted">未投稿</span>':''}
          ${ev.warn?'<span class="tag warn">要注意</span>':''}</div>
        </div>`).join('')}
      </div></div>`;
  }).join('');
}

    <div class="memoCard"><h2>✅ 日数アンカー(全一致を検算済み)</h2>
      <ul>${m.anchors.map(a=>`<li>${a}</li>`).join('')}</ul></div>
    <div class="memoCard"><h2>🔶 推定ジョイント</h2>
      <ul>${m.uncertainJoints.map(a=>`<li>${a}</li>`).join('')}</ul></div>
    <div class="memoCard issues"><h2>本文の揺れ・要確認(日数まわり)</h2>
      <ul>${m.textIssues.map(a=>`<li>${a}</li>`).join('')}</ul></div>
    <div class="memoCard issues"><h2>設定の揺れ・要確認(世界設定)</h2>
      <ul>${iss.map(a=>`<li>${a.t} <span style="color:var(--muted);font-size:11px">(${a.srcs})</span></li>`).join('')}</ul></div>

        <li>元データ: 同フォルダの「年表データ.json」。更新手順は「_引継ぎ.md」参照</li>

}

buildNav(); show(1); buildLane(); buildWorld(); buildMemo();
