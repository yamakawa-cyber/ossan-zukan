.stage{max-width:1180px;margin:0 auto;padding:26px 24px 80px}

.ttl-link:hover{color:var(--acc);border-bottom-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.ttl-link .ext{font-family:var(--sans);font-size:10px;margin-left:6px;color:var(--acc);opacity:.6;vertical-align:2px}
.ttl-link:hover .ext{opacity:1}
.ep .sum{font-size:13px;color:var(--ink-2);line-height:1.95;margin-top:7px}
.ep .keys{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.ep .key{font-size:10px;letter-spacing:.05em;padding:2px 9px;border-radius:999px;

.note{max-width:1180px;margin:0 auto;padding:0 24px 40px}
.note .box{padding:16px 20px;background:#fffdf6;border:1px solid #e6dcbe;

.empty{text-align:center;padding:70px 0;font-family:var(--serif);letter-spacing:.2em;color:var(--faint)}
footer{text-align:center;padding:34px 20px 54px;font-family:var(--serif);font-size:10.5px;
  letter-spacing:.28em;text-indent:.28em;color:var(--faint);border-top:1px solid var(--hair);background:#fff}
</style>
</head>

 keys:["影の領域","変身二層","革細工"]},
{kind:"main",no:"第21話", seq:25, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051595948232809",title:"魔剣・アクロスソード",
 sum:"魔力を固体化した黒紫の直剣が実体化する。「アクロスソード」という命名にリーネが呆れ、フレスが「ぴぃ」と鳴いた ── 異議なし、とでも言いたげな声だった。",
 keys:["アクロスソード","影の領域"]},
{kind:"main",no:"第22話", seq:26, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596010054426",title:"月と太陽",turn:true,
 sum:"リーネがこの世界の暦を教える。一週八日の八元素、三十二日の大月、四百十六日の一年、四つの季、二つの太陽と三つの月、そして王暦百四十年。アクロスはようやく、自分がこの世界の時間の中に立っているのだと感じた。",
 keys:["暦","八元素","三つの月","王暦140年"]},
{kind:"main",no:"第23話", seq:27, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596083674506",title:"行商人オルガとの出会い",turn:true,
 sum:"街道でスポークが二本折れた荷馬車に出くわす。行商人オルガと護衛のカイ・ミラを助け、リーネの木工技術が驚かれる。グラザで素材を換金する算段も立つ。「さぁ、世界を見に行こうか」",
 keys:["オルガ","カイ","ミラ","荷馬車修理"]},
{kind:"main",no:"第24話", seq:28, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596100392078",title:"タネル村でのひととき",
 sum:"タネル村へ同行し、オルガに夕食をご馳走になる。「北の山脈手前の集落から」という設定で身元を語り、村の宿で一夜を過ごす。",
 keys:["タネル村","オルガ"]},
{kind:"main",no:"第25話", seq:29, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596166053343",title:"ようやく、グラザへ",turn:true,
 sum:"ようやくグラザへ。入町税は一人銅貨二枚。レンガ造りの塀を持つ町の門をくぐる。この町の空の下を笑顔で歩く二人が、これからこの世界に大きな影響を与えていく。",
 keys:["グラザ到着","入町税"]},
{kind:"main",no:"第26話", seq:31, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596168815951",title:"二人の町散歩",
 sum:"素材を換金し、服屋で確定の服装を揃える。リーネが相場を言い当てて店主を驚かせる。湯屋で全身を洗う幸福。串焼きは明日でいいか、と思った。",
 keys:["確定服装","換金","湯屋"]},
{kind:"main",no:"第27話", seq:32, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596240076415",title:"グラザでの初めての朝",
 sum:"宿での朝。変身を一度解く習慣や、人前での振る舞いを二人で確認していく。今日こそ串焼きを食べられるのか ── アクロスの運命は、リーネの機嫌次第である。",
 keys:["宿","変身の運用"]},
{kind:"main",no:"第28話", seq:33, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596240114497",title:"土の日のグラザ",turn:true,
 sum:"市が開かれる土の日。文字が読めるかという話から、塩と水は料理の命という話まで。市場の外れの薬店で薬師ハンナと出会い、乾燥の丁寧さを見抜かれて同業者として認められる。",
 keys:["ハンナ","土の日","市場","薬草"]},
{kind:"main",no:"第29話", seq:34, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596301562862",title:"二人の馬鹿みたいな話",
 sum:"買い込んだ品を影の領域に収めながら、このまま町に住むかを話し合う。宿ではクロとフレスを離さねばならない ── 家を持つ理由が見えてくる。",
 keys:["家を持つ","影の領域"]},
{kind:"main",no:"第30話", seq:35, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596497885201",title:"ギルド登録試験",turn:true,
 sum:"冒険者ギルドで★3を自己申告。受付エミラ、試験官ゲルツ、弓使いレナと立ち合い、二人とも合格。マルコが握手で乱入してくる。ギルドランクは仮の木札から銅・鉄・銀・金・白金の五段階。",
 keys:["エミラ","ゲルツ","レナ","マルコ","★3","ギルドランク"]},
{kind:"main",no:"第31話", seq:37, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596509354978",title:"トマスのじいさん",turn:true,
 sum:"ハンナの店を訪ねた後、大家となるトマス・ベルグとの出会い。三つの質問を経て、隣家を貸す決断がなされる。閉じた目から一筋の光が、頬を伝っていた。",
 keys:["トマス","家","三つの質問"]},
{kind:"main",no:"第32話", seq:38, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596590957697",title:"言葉に気持ちを込めて",turn:true,
 sum:"引っ越しの日。トマスに昼食へ招かれ、グラザの歴史と南北の魔族観の違いを聞く。「俺にも魔族の知り合いはいた」という告白も。リーネが「トマスおじいちゃん」と呼び、「誰がおじいちゃんだ」と返される。",
 keys:["引っ越し","グロム","グラザの歴史","メルティの影"]},
{kind:"main",no:"第33話", seq:39, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596590978758",title:"赤角亭の夜",
 sum:"北門近くの赤角亭でオルガと夕食。ドルクの素性が語られ、「背中は預けていいが、心は決して預けるな」という言葉が残る。隣のリビングからは、大きないびきが聞こえていた。",
 keys:["赤角亭","オルガの名言"]},
{kind:"main",no:"第34話", seq:40, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596705942993",title:"ちゃんと送るということ",turn:true,
 sum:"ベルク村のゴブリン駆除。リーネが「ごめんね、遅くなったわね」と一番小さな個体に謝り、魔族の「ちゃんと送る」儀式を初めて実装する。人間の「土に戻す」と同じ場所で重なる。",
 keys:["ベルク村","ゴブリン","ちゃんと送る"]},
{kind:"main",no:"第35話", seq:41, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596707649796",title:"出発前夜",
 sum:"ギルドで報酬を受け取り、討伐の準備を整える夜。ドルクへの複雑な思いを打ち明けたアクロスに、リーネが「逃げないって、決めたの」「これは私が自分で決めていることなのよ」と返す。悪い夢は、見なさそうだ。",
 keys:["リーネの成長","出発前夜"]},
{kind:"main",no:"第36話", seq:43, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596778693110",title:"初めての集団行動",
 sum:"白晨の少し前に起床し、討伐隊として初めての集団行動。緊張を隠さずに認め、野営の夜を過ごす。クロとフレスの働きが冒険者たちを驚かせる。",
 keys:["討伐隊","野営","クロとフレス"]},
{kind:"main",no:"第37話", seq:44, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596787143447",title:"ドルクという男",turn:true,
 sum:"焚き火の反対側でレナとリーネが語らう一方、「俺は寝ない」と言うドルクの輪郭が浮かび上がる。森の入り口が、朝の光の中で黒く口を開けていた。",
 keys:["ドルク","野営"]},
{kind:"main",no:"第38話", seq:45, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596884730633",title:"魔狼の森",turn:true,
 sum:"二十頭を超える魔狼の群れとの戦い。額に赤黒い紋を持ち金色の目をした★4の統率個体（デモンウルフ）が現れ、マルコが脇腹を抉られる。アクロスがアクロスソードと雷撃で撃破。ドルクがリーネを命がけで守る。",
 keys:["魔狼","統率個体","マルコ負傷"]},
{kind:"main",no:"第39話", seq:46, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596912736696",title:"魔の吹き溜まり",turn:true,
 sum:"戦いの後始末。毛皮の剥ぎ方、牙の取り方を教わりながら素材を回収していく。そしてこの森の奥に魔の吹き溜まりがあることが語られる。",
 keys:["吹き溜まり","素材回収"]},
{kind:"main",no:"第40話", seq:47, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596945733375",title:"帰路と帰還",
 sum:"白晨の光の中を帰路につく。道中の軽口と笑い。ちゃんと帰ってこれた ── この喜びを大事にしたい。",
 keys:["帰還","街道"]},
{kind:"main",no:"第41話", seq:49, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051596980732915",title:"泣いて笑って",turn:true,
 sum:"リーネの一人称で語られる回。泥だらけで汗臭いアクロスの隣を歩きながら「そんな私も、馬鹿みたい。でも──それでいいと、今の私は思える」。魔族の涙は光になる。",
 keys:["リーネ視点","初めて泣く","エリー"]},
{kind:"main",no:"第42話", seq:50, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051597048573216",title:"嘘のない生き方を",turn:true,
 sum:"トマスへ魔族であることを打ち明ける。震えながらも顔は上げたまま。そしてギルド長ギースの名が出る ── 双槍のギース。沈黙が、部屋を満たした。",
 keys:["告白","トマス","ギースの名"]},
{kind:"main",no:"第43話", seq:51, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051597064452871",title:"筋を通すということ",turn:true,
 sum:"ギルド長ギースへも正体を明かす。「……魔族、か」という呟きの後、吹き溜まりを放置した先の危険が語られ、受け入れられる。四つの影が、グラザの通りに伸びていた。",
 keys:["ギース","告白","吹き溜まり"]},
{kind:"main",no:"第44話", seq:52, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051597182031336",title:"一歩、そしてまた一歩",
 sum:"屋台で鶏串と黒パンを買い、グロムの店でショートソードと短杖ナイフを購う。「一本角に左右違う色の目、おまけに腕には魔紋」と己を省みる場面も。夕暮れが、静かに夜に変わろうとしていた。",
 keys:["ショートソード","短杖ナイフ","グロム"]},
{kind:"main",no:"第45話", seq:53, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051597222199571",title:"年甲斐もなく",
 sum:"二人が帰った後、居間に一人で座るトマス。「最初から気付いてたがな」── 魔力回路を見る稽古の計画を立てる。逃げていた頃には考えもしなかったこと。明日が、楽しみだ。",
 keys:["トマス視点","稽古の計画"]},
{kind:"main",no:"第46話", seq:55, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051597361799105",title:"一挙手一投足",turn:true,
 sum:"トマスによる剣術指導が始まる。「力を抜けと言っているんじゃない」── すり足、呼吸、握り方、間合い。「今のお前が、この町で最も長く過ごす相手だ」という言葉も。",
 keys:["剣術指導","トマス"]},
{kind:"main",no:"第47話", seq:56, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051597398413853",title:"桜花のような時間",turn:true,
 sum:"アクロスがリーネに花刺繍のエプロンを贈る。そして桜の花びらの栞 ── 「桜は、大きな木で」と故郷の樹を語る。「生きてるって気がする毎日ね」。窓辺のアリッサムが月の光に浮かぶ穏やかな夜。",
 keys:["エプロン","桜の栞","共存のシンボル"]},
{kind:"main",no:"第48話", seq:57, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051597405609797",title:"生き残るための目",
 sum:"ギースも稽古に加わる。「俺の顔だけを見るな。足だけを見るな」── 目付の教え、そして集団戦の鉄則。昼には吹き溜まりの処理が三日後と通達される。",
 keys:["ギース","目付","集団戦","出発通達"]},
{kind:"main",no:"第49話", seq:58, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051597405655760",title:"五十三回の死",turn:true,
 sum:"稽古の中で五十三回「死ぬ」。「一人しか見ていない。お前の相手は今、何人だ」── 通すものを自在に選ぶ感覚も掴み始める。あと一日、明後日出発。",
 keys:["五十三回の死","稽古"]},
{kind:"main",no:"第50話", seq:59, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051597479877621",title:"世界の広さを知る",turn:true,
 sum:"トマスがフォールンについて語る。痛みを感じず、腕を切っても心臓を突いても止まらない存在。「★を信じるな、自分の目と体で感じたものだけを信じろ」。防具一式とポーションを揃える。",
 keys:["フォールン","闘気術","装備"]},
{kind:"main",no:"第51話", seq:61, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051598090946512",title:"絶世のウェイン",turn:true,
 sum:"町長グリフィスの用心棒ウェインが合流。絶世の美女と見紛う武人。リーネが「取られる予定はもとからないですから」と言い返す。この出発から、アクロスたちは世界の何かに触れ始める ── そのことに、今はまだ誰も気づいていない。",
 keys:["ウェイン","出発"]},
{kind:"main",no:"第52話", seq:62, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051601949895095",title:"決意の森へ向かう道",
 sum:"北門を出て決意の森へ。道中で「今のメンバーに、お前たちが魔族であることを」という話が持ち上がる。壁を一つ、今日それを越えた。",
 keys:["決意の森","正体開示の相談"]},
{kind:"main",no:"第53話", seq:63, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051602031235048",title:"伸ばした手の行方",
 sum:"街道の土が乾き、靴の裏に砂がつく道中。「だから、大丈夫だ。俺はお前たちを怖がらない」── 森の夜に、火の音とマルコの泣き声が響く。",
 keys:["マルコ","信頼"]},
{kind:"main",no:"第54話", seq:64, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051602172528630",title:"焚き火の内緒話",
 sum:"焚き火のそばで、ウェインが長い黒髪を肩の前に流しながら語る。エリーとの間にも言葉が交わされる。今夜は、嘘のない夜にしよう。",
 keys:["ウェイン","エリー","焚き火"]},
{kind:"main",no:"第55話", seq:65, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051602173327065",title:"嘘のない夜を",turn:true,
 sum:"ウェインとエリーに魔族であることを明かす夜。「いや。こいつらは違う」と受け止められ、「皆、よろしく頼むぞ」と輪が結ばれる。逃げる時は全力で逃げろ ── そんな約束も。",
 keys:["告白","ウェイン","エリー","仲間"]},
{kind:"main",no:"第56話", seq:67, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051602173460071",title:"新しい朝を迎えて",
 sum:"夜明けはまだ遠い。東の空の端が藍から薄い灰へ変わる頃、顔を洗い飯を食い、一同は森の奥にある魔狼の巣へ向かって進む。",
 keys:["出発","魔狼の巣"]},
{kind:"main",no:"第57話", seq:68, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051602246879744",title:"誰も知らない戦場",turn:true,
 sum:"戦場で魔王軍と遭遇。女将官マグナティア、偵察のラーナ、盾のギリアムが、大蟲・岩喰い・黒蜜蟻の群れと戦っていた。鱗鎧に黒の裾絞りの袴という和洋折衷の軍装。誰も、この先を予想できない。",
 keys:["マグナティア","ラーナ","ギリアム","大蟲","岩喰い","魔王軍"]},
{kind:"main",no:"第58話", seq:69, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051602432691798",title:"探り合う刃、認め合う刃",turn:true,
 sum:"黒紫の霧が渦を巻く窪地での共闘。「数を減らすぞ！ 味方を巻き込むな！」「礼は後でいい。立て。まだ来るぞ」── 刃を交えながら互いを測り合う。ここからだ、次は言葉を交わそう。",
 keys:["共闘","マグナティア"]},
{kind:"main",no:"第59話", seq:70, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051602455704733",title:"停戦と会談",turn:true,
 sum:"魔蟲の波が収まり、負傷者の治療が優先される。「お前、何でそっち側にいる」という混乱を経て、停戦と会談が成る。紫の瞳が、アクロスの額の一本角をまっすぐに見つめる。",
 keys:["停戦","会談","一本角"]},
{kind:"main",no:"第60話", seq:71, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051602770461431",title:"魔族の未来のために",turn:true,
 sum:"「君はどこから来た魔族だ？　そして君の目的は何だ？」── 魔法の法則そのものに触れる力、使徒と七柱神の話が交わされる。マグナティアもまた、魔族の未来を背負った者だった。",
 keys:["マグナティア","使徒","七柱神"]},
{kind:"main",no:"第61話", seq:73, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051602770494037",title:"打ち合わせと休息",
 sum:"天幕での打ち合わせ。魔結界を安定させ、これからの手順を詰めていく。「私たちが話すべきことは、まだ山ほどある」。束の間の休息と、リーネの膝の温かさ。",
 keys:["打ち合わせ","魔結界"]},
{kind:"main",no:"第62話", seq:74, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051602924051144",title:"瘴気とオーブ",
 sum:"洞窟へ。魔導灯で照らしながら瘴気の膜を扱う技を試す。「アクロス、膜を閉じてくれ」── 銀紫の光が、闇の底へ続く道を淡く照らす。まだ先は長い。",
 keys:["オーブ","洞窟","瘴気の膜"]},
{kind:"main",no:"第63話", seq:75, url:"https://kakuyomu.jp/works/2912051595460293642/episodes/2912051603339264172",title:"濃すぎる瘴気",turn:true,
 sum:"マグナティアのオーブが黒く濁っていく。最奥にいる「ミストレイス」の存在が語られる ── 瘴気が形を持ったもので、生き物かどうかすらはっきりしない。ギルドではこれを「霧呼び」と呼ぶ。確認された土地では数日のうちにフォールンが生まれる。",
 keys:["ミストレイス","霧呼び","フォールン"]},

<script>
/* 本編・断章・英雄譚・真魔の章は上下の関係ではない。
   本編がアクロスとリーネの日常から物語を進め、
   世界の重要な真実は断章と英雄譚のほうで明かされる。
   なので既定は分類ごとの棚ではなく、掲載順に一本で並べた「読み順」。 */
const ARCS = [
  { id:"main",    label:"本 編",    short:"本 編",
    desc:"アクロスとリーネの視点。日常と選択を、一日も飛ばさずに追う" },
  { id:"danshou", label:"断 章",    short:"断 章",
    desc:"本編の裏側で動いている人々の視点。世界の輪郭がここで見えてくる" },
  { id:"eiyu",    label:"英 雄 譚", short:"英雄譚",
    desc:"勇者パーティーの側の物語。重く、静かなトーンで描かれる" },
  { id:"shinma",  label:"真魔の章", short:"真魔",
    desc:"魔族側の物語。魔王の座をめぐる、もうひとつの筋" }
];
const ARC = Object.fromEntries(ARCS.map(a => [a.id, a]));
/* カクヨムの作品トップ。各話に url が無い場合はここへ飛ぶ。
   空文字のままなら、リンクは表示されない */
const KAKUYOMU_WORK = "https://kakuyomu.jp/works/2912051595460293642";
let curArc = "all", curQ = "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function renderTabs(){
  const EPISODES = window.EPISODES || [];
  const all = [{ id:"all", label:"読 み 順" }, ...ARCS.filter(a => EPISODES.some(e => e.kind === a.id))];
  $("#tabs").innerHTML = all.map(a => {
    const n = a.id === "all" ? EPISODES.length : EPISODES.filter(e => e.kind === a.id).length;
    return `<button class="tab${a.id===curArc?" active":""}" data-arc="${a.id}">${a.label}<span class="n">${n}</span></button>`;
  }).join("") + `<a class="tab" href="index.html">図 鑑</a><a class="tab" href="map.html">世 界 地 図</a><a class="tab" href="年表.html">年 表</a>`;
  document.querySelectorAll(".tab[data-arc]").forEach(b =>
    b.onclick = () => { curArc = b.dataset.arc; render(); });
}

function match(e){
  if (curArc !== "all" && e.kind !== curArc) return false;
  const q = curQ.trim().toLowerCase();
  if (!q) return true;
  return [e.no, e.title, e.sum, ...(e.keys||[])].join(" ").toLowerCase().includes(q);
}

/* 題名を読みに行けるリンクにする。
   各話の url があればそこへ、無ければ作品トップへ。どちらも無ければただの見出し */
function linkTitle(e){
  const href = e.url || KAKUYOMU_WORK;
  if (!href) return esc(e.title);
  return `<a class="ttl-link" href="${esc(href)}" target="_blank" rel="noopener">`
       + `${esc(e.title)}<span class="ext">↗</span></a>`;
}
/* ══════════ 第50話からの折りたたみ ══════════
   第50話から物語が大きく動くので、そこから先は畳んでおく。
   判定は話数ではなく読み順の通し番号（seq）で行う。
   本編のあいだに断章と英雄譚が挟まっているため、
   「第50話以降」は本編だけの話ではないので。 */
const FOLD_FROM = 50;
let opened = false;
let foldSeq = Infinity;

function setFoldPoint(list){
  const pivot = list.find(e => e.kind === "main" && e.no === "第" + FOLD_FROM + "話");
  foldSeq = pivot ? pivot.seq : Infinity;
}
const isFolded = e => (e.seq ?? Infinity) >= foldSeq;

function foldBarHTML(tail){
  return `<div class="fold">
    <span class="fold-msg">第${FOLD_FROM}話から先、物語が大きく動きます</span>
    <button class="fold-btn" aria-expanded="${opened}">${
      opened ? "畳む" : `続きを表示（${tail.length}話）`}</button>
  </div>`;
}

/* ══════════ 5話ごとの区切り ══════════
   本編5話ぶんと、そのうしろに置かれた断章／英雄譚／真魔の章1話で
   ひと区切りになっている。読み順の並びでは、その単位で見出しを立てる。 */
function toUnits(list){
  const units = [];
  let cur = [], mains = 0;
  for (const e of list){
    if (e.kind === "main" && mains >= 5 && cur.length){ units.push(cur); cur = []; mains = 0; }
    cur.push(e);
    if (e.kind === "main") mains++;
    else { units.push(cur); cur = []; mains = 0; }   // 外伝が来たらそこで一区切り
  }
  if (cur.length) units.push(cur);
  return units;
}
/* 断章の no は「断章 第二話」のように分類名込みなので、
   札と並べたときに「断 章 断章 第二話」と重ならないよう前を落とす */
const numShort = e => e.no.replace(/^(断章|英雄譚|真魔の章)\s*/, "");

function unitLabel(unit){
  const mains = unit.filter(e => e.kind === "main");
  const side  = unit.filter(e => e.kind !== "main");
  const range = mains.length
    ? (mains.length === 1 ? mains[0].no : mains[0].no + " – " + mains[mains.length-1].no)
    : "";
  const tail = side.map(e => (ARC[e.kind]?.short || "") + " " + numShort(e)).join(" ／ ");
  return [range, tail].filter(Boolean).join("　＋　");
}

function epHTML(e){
  const a = ARC[e.kind];
  return `<article class="ep" data-kind="${esc(e.kind)}">
    <div class="no">
      <span class="kindtag">${esc(a ? a.short : "")}</span>
      <span class="num">${esc(numShort(e))}</span>
    </div>
    <div>
      <h3 class="ttl">${linkTitle(e)}${e.turn?`<span class="flag">転換点</span>`:""}</h3>
      ${e.sum ? `<p class="sum">${esc(e.sum)}</p>` : ""}
      ${(e.keys&&e.keys.length) ? `<div class="keys">${e.keys.map(k=>`<span class="key">${esc(k)}</span>`).join("")}</div>` : ""}
    </div>
  </article>`;
}

function render(){
  const EPISODES = window.EPISODES || [];
  renderTabs();
  setFoldPoint(EPISODES);

  const bySeq = (a, b) => (a.seq ?? 1e9) - (b.seq ?? 1e9);
  const list = EPISODES.filter(match).sort(bySeq);
  const searching = !!curQ.trim();      // 検索中は畳まない。探した話が隠れては意味がない
  const head = searching ? list : list.filter(e => !isFolded(e));
  const tail = searching ? []   : list.filter(isFolded);

  /* 読み順のときだけ5話ごとの区切りを立てる。
     分類タブを選んでいるときは、その筋だけを素直に並べる。 */
  const grouped = curArc === "all" && !searching;
  const units = grouped ? toUnits(list) : [list];
  const rows = xs => `<div class="list">${xs.map(epHTML).join("")}</div>`;

  let body = "", barPlaced = false;
  for (const u of units){
    const vis = searching ? u : u.filter(e => !isFolded(e));
    const hid = searching ? [] : u.filter(isFolded);
    /* 折りたたみの境目が区切りの途中に来ることがある。
       その場合も見出しは区切り全体の名前を出したまま、
       途中に帯を差し込む。見出しが嘘にならないように。 */
    const bar = hid.length && !barPlaced;
    const shows = vis.length || (opened && hid.length);
    if (!shows && !bar) continue;

    if (grouped && shows) body += `<div class="unit-head"><span class="unit-rng">${esc(unitLabel(u))}</span></div>`;
    if (vis.length) body += rows(vis);
    if (bar){ body += foldBarHTML(tail); barPlaced = true; }
    if (opened && hid.length) body += rows(hid);
  }

  const a = curArc === "all" ? null : ARC[curArc];
  const html = `<section class="arc">
      <div class="arc-head">
        <h2>${a ? a.label : "読 み 順"}</h2>
        <span class="desc">${esc(a ? a.desc
          : "本編・断章・英雄譚・真魔の章を、カクヨムの目次どおりに並べた読み順。本編5話ごとに、外伝が1話挟まる。")}</span>
        <span class="cnt">${list.length} 話</span>
      </div>
      ${body}
    </section>`;

  $("#stage").innerHTML = list.length ? html : `<div class="empty">該当する話がありません</div>`;
  document.querySelectorAll(".fold-btn").forEach(b =>
    b.onclick = () => { opened = !opened; render(); });
}
$("#q").oninput = e => { curQ = e.target.value; render(); };

if (typeof window.EPISODES === "undefined" && typeof EPISODES !== "undefined") window.EPISODES = EPISODES;
render();
</script>
